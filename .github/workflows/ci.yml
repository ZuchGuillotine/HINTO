name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run api:build
      - run: npm run lint
      - run: npm run api:test
      - name: Verify web JS parses
        run: |
          for f in $(git ls-files 'apps/web/**/*.js' 'apps/web/**/*.mjs'); do node --check "$f"; done

  api-image:
    name: API container builds
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: hinto-api:ci
