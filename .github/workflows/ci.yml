name: CI

on:
  push:
    branches: [main, restart-plan]
  pull_request:

jobs:
  verify:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run api:build
      - run: npm run lint
      - run: npm run api:test -- --runInBand
      - run: npm run web:test
      - name: Web build with staging API URL
        run: npm run web:build:staging
      - name: Migration runner parses
        run: node --check db/migrate.mjs

  image:
    name: API container builds
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hinto-api:ci
