name: Deploy API Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - services/api/**
      - packages/domain/**
      - packages/contracts/**
      - packages/prompts/**
      - .github/workflows/deploy-api-staging.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "881490119784"
  ECR_REPOSITORY: hinto-api
  ECS_CLUSTER: hinto-staging-cluster
  ECS_SERVICE: hinto-staging-api
  ECS_TASK_FAMILY: hinto-staging-api

jobs:
  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::881490119784:role/hinto-staging-github-deploy-role
          role-session-name: hinto-staging-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v3

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register task definition revision
        id: task-def
        env:
          IMAGE_URI: ${{ steps.image.outputs.image-uri }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

          node <<'NODE'
          const fs = require('fs');
          const task = JSON.parse(fs.readFileSync('task-definition.json', 'utf8'));
          const allowed = [
            'family',
            'taskRoleArn',
            'executionRoleArn',
            'networkMode',
            'containerDefinitions',
            'volumes',
            'placementConstraints',
            'requiresCompatibilities',
            'cpu',
            'memory',
            'ephemeralStorage',
            'runtimePlatform',
          ];
          const next = {};
          for (const key of allowed) {
            if (task[key] !== undefined) next[key] = task[key];
          }
          next.containerDefinitions = next.containerDefinitions.map((container) =>
            container.name === 'api'
              ? { ...container, image: process.env.IMAGE_URI }
              : container
          );
          fs.writeFileSync('task-definition-next.json', JSON.stringify(next, null, 2));
          NODE

          TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "task-definition-arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service if it exists
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task-definition-arn }}
        run: |
          set -euo pipefail
          SERVICE_STATUS="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)"

          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$TASK_DEF_ARN" \
              --force-new-deployment >/dev/null
          else
            echo "ECS service $ECS_SERVICE does not exist yet; image and task definition are ready."
          fi
