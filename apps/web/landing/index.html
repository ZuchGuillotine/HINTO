<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HNNT</title>
    <meta name="description" content="Rank what you can't say out loud." />
    <meta name="theme-color" content="#0a0608" />
    <meta property="og:title" content="HNNT" />
    <meta property="og:description" content="Rank what you can't say out loud." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hnnt.app/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0608'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF4275'/%3E%3C/svg%3E" />
    <style>
      :root {
        --ink: #0a0608;
        --ink-deep: #050204;
        --pink: #ff4275;
        --pink-soft: #ff7396;
        --fog: rgba(255, 66, 117, 0.08);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--ink-deep);
        color: #f5f5f5;
        font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            60% 45% at 50% 42%,
            var(--fog) 0%,
            transparent 70%
          ),
          radial-gradient(
            80% 60% at 50% 100%,
            rgba(255, 66, 117, 0.05) 0%,
            transparent 60%
          ),
          var(--ink);
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 3px 3px;
        opacity: 0.6;
        pointer-events: none;
        mix-blend-mode: overlay;
      }

      main {
        position: relative;
        text-align: center;
        padding: 0 24px;
        z-index: 1;
      }

      .mark {
        font-size: clamp(72px, 18vw, 180px);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fafafa;
        text-shadow: 0 0 64px rgba(255, 66, 117, 0.25);
      }

      .mark .dot {
        display: inline-block;
        width: 0.18em;
        height: 0.18em;
        border-radius: 50%;
        background: var(--pink);
        margin-left: 0.04em;
        vertical-align: baseline;
        box-shadow: 0 0 24px var(--pink), 0 0 4px var(--pink-soft);
        animation: pulse 3.4s ease-in-out infinite;
      }

      .tagline {
        margin-top: 32px;
        font-size: clamp(14px, 2.2vw, 18px);
        font-weight: 400;
        letter-spacing: 0.02em;
        color: rgba(245, 245, 245, 0.72);
        max-width: 32ch;
        margin-left: auto;
        margin-right: auto;
      }

      .footer {
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(245, 245, 245, 0.32);
      }

      .footer .sep {
        margin: 0 10px;
        color: rgba(255, 66, 117, 0.5);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.18);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">hnnt<span class="dot" aria-hidden="true"></span></div>
      <p class="tagline">Rank what you can't say out loud.</p>
    </main>
    <div class="footer">
      <span>hnnt.app</span><span class="sep">·</span><span>soon</span>
    </div>
  </body>
</html>
